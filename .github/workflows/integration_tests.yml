name: Integration Tests Default

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  run-integration-tests:
    name: Run Integration Tests with Default
    runs-on: ubuntu-latest
    strategy: 
      fail-fast: false
      matrix: 
        dbEngine: ["aurora-mysql", "aurora-postgres", "aurora-limitless-postgres", "multi-az-mysql", "multi-az-postgres"]
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Set up JDK 8"
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "corretto"
          java-version: 8
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: .test/go.sum
      - name: Configure AWS Credentials 
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: go_int_test
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Run Integration Tests
        run: |
          cd .test/test_framework/host && ./gradlew --no-parallel --no-daemon test-${{ matrix.dbEngine }} --info
        env:
          RDS_DB_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AURORA_MYSQL_DB_ENGINE_VERSION: "default"
          AURORA_PG_DB_ENGINE_VERSION: "default"
          RDS_MYSQL_DB_ENGINE_VERSION: "default"
          RDS_PG_DB_ENGINE_VERSION: "default"
          AWS_RDS_MONITORING_ROLE_ARN: ${{ secrets.AWS_RDS_MONITORING_ROLE_ARN }}
      - name: "Get Github Action IP"
        if: always()
        id: ip
        run: echo "ipv4=$(curl -s --retry 3 https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: "Remove Github Action IP"
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-name default \
            --protocol -1 \
            --port -1 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 \
          2>&1 > /dev/null;
      - name: Archive results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-report-default-${{ matrix.dbEngine }}
          path: |
            ./.test/test_framework/host/build/test-results/
            ./.test/test_framework/container/reports/
          retention-days: 5

name: Aurora Performance Tests

on:
  workflow_dispatch:

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  run-integration-tests:
    continue-on-error: true
    strategy:
      matrix:
        db: [mysql, pg]

    name: Run Aurora ${{ matrix.db }} container performance tests
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50

      - name: Set up JDK 8
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "corretto"
          java-version: 8

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25' 
          cache-dependency-path: .test/go.sum

      - name: Configure AWS Credentials
        id: creds
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: go_aurora_perf_tests
          role-duration-seconds: 43200
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          output-credentials: true

      - name: Run Integration Tests
        working-directory: ${{ github.workspace }}/.test/test_framework/host
        run: |
          ./gradlew --no-parallel --no-daemon test-aurora-${{ matrix.db }}-performance --info
        env:
          RDS_DB_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ steps.creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.creds.outputs.aws-session-token }}
          NUM_INSTANCES: 5
          AURORA_MYSQL_DB_ENGINE_VERSION: "default"
          AURORA_PG_DB_ENGINE_VERSION: "default"

      - name: Get Github Action IP
        if: always()
        id: ip
        run: echo "ipv4=$(curl -s --retry 3 https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Remove Github Action IP
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-name default \
            --protocol -1 \
            --port -1 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 \
          2>&1 > /dev/null;

      - name: Archive Performance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.db }}-performance-results
          path: ${{ github.workspace }}/.test/test_framework/container/tests/reports
          retention-days: 5

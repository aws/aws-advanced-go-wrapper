name: Integration Tests Latest

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to check out'
        required: false
        default: ''
      repository:
        description: 'Fork repository to check out (owner/repo)'
        required: false
        default: ''
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request_target:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  # Auto-approves push events, manual dispatches, and pull requests from the same
  # repository (i.e. not a fork).
  approve:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - run: echo "Approved - not a fork PR"

  # Fork PRs run untrusted code with access to secrets, so they are gated behind
  # the "integration-tests" environment which requires manual maintainer approval.
  approve-fork:
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    environment: integration-tests
    steps:
      - run: echo "Fork PR approved by maintainer"

  run-integration-tests:
    name: Run Integration Tests with Latest
    needs: [approve, approve-fork]
    if: >
      always() &&
      (needs.approve.result == 'success' || needs.approve-fork.result == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dbEngine: ["aurora-mysql", "aurora-postgres", "aurora-limitless-postgres", "multi-az-mysql", "multi-az-postgres"]
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
      - name: "Set up JDK 8"
        uses: actions/setup-java@v3
        with:
          distribution: "corretto"
          java-version: 8
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache-dependency-path: .test/go.sum
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: go_int_test_latest
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Run Integration Tests
        run: |
          cd .test/test_framework/host && ./gradlew --no-parallel --no-daemon test-${{ matrix.dbEngine }} --info
        env:
          RDS_DB_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AURORA_MYSQL_DB_ENGINE_VERSION: "latest"
          AURORA_PG_DB_ENGINE_VERSION: "latest"
          AWS_RDS_MONITORING_ROLE_ARN: ${{ secrets.AWS_RDS_MONITORING_ROLE_ARN }}
      - name: "Get Github Action IP"
        if: always()
        id: ip
        uses: haythem/public-ip@v1.3

      - name: "Remove Github Action IP"
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-name default \
            --protocol -1 \
            --port -1 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 \
          2>&1 > /dev/null;
      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report-latest-${{ matrix.dbEngine }}
          path: ./.test/test_framework/container/reports
          retention-days: 5
